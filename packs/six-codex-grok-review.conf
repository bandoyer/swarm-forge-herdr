# worktrees and the passing QA handoff is terminal for implementation.
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window specifier codex exp-a-specifier task --model gpt-5.6-sol --dangerously-bypass-approvals-and-sandbox
