window cleaner codex exp-a-cleaner batch --model gpt-5.6-sol --dangerously-bypass-approvals-and-sandbox
window architect codex exp-a-architect batch --model gpt-5.6-sol --dangerously-bypass-approvals-and-sandbox
window hardener codex exp-a-hardener batch --model gpt-5.6-sol --dangerously-bypass-approvals-and-sandbox
window qa codex exp-a-qa batch --model gpt-5.6-sol --dangerously-bypass-approvals-and-sandbox
