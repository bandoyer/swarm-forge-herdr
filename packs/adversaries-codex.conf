# adversaries-codex: the adversaries chain on codex agents, for sessions
# where the operator is Codex (model-follows-operator; budgets stay
# separate). Chain: coder -> reviewer -> coder. Task mode only.
# Workers run unattended like the claude packs' auto mode: Codex's
# sandbox blocks MSBuild's IPC sockets and its approval prompts stall
# the chain (validated 2026-08-17), so the bypass flag is required on a
# trusted dev machine.
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window coder codex master task --dangerously-bypass-approvals-and-sandbox
window reviewer codex reviewer task --dangerously-bypass-approvals-and-sandbox
