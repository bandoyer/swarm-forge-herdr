# six-codex-grok-fable-review: recommended Grok+Codex six-pack with Fable
# 5 High in the one Claude seat. Same as six-codex-grok-review except
# architect is Claude Fable 5 at high — the review-shaped spend (reads a
# diff, writes structure findings) so leftover Fable tokens are not
# burned on spec or implementation. Every role uses a linked worktree.
# Passing QA is terminal for implementation.
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window specifier codex cgf-specifier task --model gpt-5.6-sol -c model_reasoning_effort=xhigh -c web_search=disabled --disable multi_agent --disable multi_agent_v2 --dangerously-bypass-approvals-and-sandbox
window coder grok cgf-coder task --model grok-4.6 --reasoning-effort high --permission-mode bypassPermissions --no-subagents --disable-web-search
window cleaner codex cgf-cleaner batch --model gpt-5.6-sol -c model_reasoning_effort=high -c web_search=disabled --disable multi_agent --disable multi_agent_v2 --dangerously-bypass-approvals-and-sandbox
window architect claude cgf-architect batch --model claude-fable-5 --effort high
window hardener grok cgf-hardener batch --model grok-4.6 --reasoning-effort high --permission-mode bypassPermissions --no-subagents --disable-web-search
window qa codex cgf-qa batch --model gpt-5.6-sol -c model_reasoning_effort=xhigh -c web_search=disabled --disable multi_agent --disable multi_agent_v2 --dangerously-bypass-approvals-and-sandbox
