# six-pack: full pipeline with dedicated hardening and QA.
# Chain: specifier -> coder -> cleaner -> architect -> hardener -> QA,
# then QA broadcasts the completion handoff (merge-only for every recipient).
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window specifier claude master
window coder claude coder
window cleaner claude cleaner batch
window architect claude architect batch
window hardener claude hardener batch
window QA claude QA batch
