# six-pack: full pipeline with dedicated hardening and qa.
# Chain: specifier -> coder -> cleaner -> architect -> hardener -> qa.
# qa findings route back to specifier; a passing qa broadcasts the
# completion handoff (merge-only for every recipient).
# Codex workers run unattended with approval and sandbox prompts bypassed in
# trusted development checkouts. The active Codex model is inherited.
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window specifier codex master task --dangerously-bypass-approvals-and-sandbox
window coder codex coder task --dangerously-bypass-approvals-and-sandbox
window cleaner codex cleaner batch --dangerously-bypass-approvals-and-sandbox
window architect codex architect batch --dangerously-bypass-approvals-and-sandbox
window hardener codex hardener batch --dangerously-bypass-approvals-and-sandbox
window qa codex qa batch --dangerously-bypass-approvals-and-sandbox
