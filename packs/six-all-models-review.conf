# six-all-models-review: benchmark-selected Claude, Codex, and Grok six-pack.
# Every role uses a linked worktree. Passing QA produces a terminal candidate
# for human review and does not integrate it into the protected branch.
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window specifier claude all-specifier task --model claude-opus-5 --effort xhigh
window coder codex all-coder task --model gpt-5.6-sol -c model_reasoning_effort=high -c web_search=disabled --disable multi_agent --disable multi_agent_v2 --dangerously-bypass-approvals-and-sandbox
window cleaner claude all-cleaner batch --model claude-opus-5 --effort high
window architect claude all-architect batch --model claude-opus-5 --effort xhigh
window hardener grok all-hardener batch --model grok-4.6 --reasoning-effort high --permission-mode bypassPermissions --no-subagents --disable-web-search
window qa codex all-qa batch --model gpt-5.6-sol -c model_reasoning_effort=xhigh -c web_search=disabled --disable multi_agent --disable multi_agent_v2 --dangerously-bypass-approvals-and-sandbox
