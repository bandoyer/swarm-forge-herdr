# two-pack: fast backend loop — coder implements, cleaner refactors.
# Chain: coder -> cleaner -> coder (return handoff is merge-only).
# Codex workers run unattended, so approval and sandbox prompts are bypassed
# in trusted development checkouts. The active Codex model is inherited.
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window coder codex master task --dangerously-bypass-approvals-and-sandbox
window cleaner codex cleaner batch --dangerously-bypass-approvals-and-sandbox
