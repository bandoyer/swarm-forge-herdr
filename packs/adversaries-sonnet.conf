# adversaries-sonnet: the adversaries chain on claude workers pinned to
# Sonnet, so implementation slices spend the all-models weekly bucket
# instead of the Fable bucket (budget tiering, 2026-08-18). Fable stays
# the operator; edit a role to --model opus for a heavier reviewer.
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window coder claude master task --model sonnet
window reviewer claude reviewer task --model sonnet
