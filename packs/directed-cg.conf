# directed-cg: one Grok builder and one Codex reviewer, coordinated only by
# the human-facing Director. Workers use isolated worktrees; handoffd is off.
# swarmforge-mode: directed
# swarmforge-max-handoffs-per-task: 0
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window builder grok directed-builder task --model grok-4.6 --reasoning-effort high --permission-mode bypassPermissions --no-subagents --disable-web-search
window reviewer codex directed-reviewer task --model gpt-5.6-sol -c model_reasoning_effort=max -c web_search=disabled --disable multi_agent --disable multi_agent_v2 --dangerously-bypass-approvals-and-sandbox
