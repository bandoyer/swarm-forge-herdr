# six-claude-codex-review: benchmark-informed Claude and Codex six-pack.
# Every role uses a linked worktree. Passing QA produces a terminal candidate
# for human review and does not integrate it into the protected branch.
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window specifier claude cc-specifier task --model claude-opus-5 --effort xhigh
window coder codex cc-coder task --model gpt-5.6-sol -c model_reasoning_effort=high -c web_search=disabled --disable multi_agent --disable multi_agent_v2 --dangerously-bypass-approvals-and-sandbox
window cleaner claude cc-cleaner batch --model claude-opus-5 --effort high
window architect claude cc-architect batch --model claude-opus-5 --effort xhigh
window hardener claude cc-hardener batch --model claude-opus-5 --effort xhigh
window qa codex cc-qa batch --model gpt-5.6-sol -c model_reasoning_effort=xhigh -c web_search=disabled --disable multi_agent --disable multi_agent_v2 --dangerously-bypass-approvals-and-sandbox
