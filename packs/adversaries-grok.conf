# adversaries-grok: the adversaries chain on grok agents, for sessions
# where the operator is Grok (model-follows-operator; budgets stay
# separate). Chain: coder -> reviewer -> coder. Task mode only.
# Workers run unattended like the claude packs' auto mode: approval
# prompts stall the chain (same lesson as Codex, 2026-08-17), so
# bypassPermissions is required on a trusted dev machine. grok-4.6 at
# high reasoning is pinned; subagents and web search stay off because
# the swarm is the multi-agent system and the work is repository-local.
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window coder grok master task --model grok-4.6 --reasoning-effort high --permission-mode bypassPermissions --no-subagents --disable-web-search
window reviewer grok reviewer task --model grok-4.6 --reasoning-effort high --permission-mode bypassPermissions --no-subagents --disable-web-search
