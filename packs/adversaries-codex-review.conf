# adversaries-codex-review: the Codex adversaries chain with a human
# integration boundary. Both agents work in linked worktrees, so the project
# root and its main branch remain untouched until the operator accepts the
# terminal candidate.
# Chain: coder -> reviewer -> coder. Task mode only.
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window coder codex candidate task --dangerously-bypass-approvals-and-sandbox
window reviewer codex reviewer task --dangerously-bypass-approvals-and-sandbox
