# adversaries-sonnet-opus: Sonnet writes the code, Opus reviews it. The
# cheap seat does the bulk work (coding burns the most tokens) and the
# sharp seat reads a diff and writes findings, so the review costs a
# fraction of the implementation. This is the everyday-plus rung: a step
# up from adversaries-sonnet when a slice needs a reviewer that will
# actually catch things, without paying Opus rates twice. Both seats
# spend the all-models weekly bucket; Fable is untouched.
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window coder claude master task --model sonnet
window reviewer claude reviewer task --model opus
