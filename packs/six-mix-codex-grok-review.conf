# six-mix-codex-grok-review: Codex and Grok replacement for the
# three-provider mix when Fable capacity is unavailable. Sol specifies,
# implements, and QAs; Grok cleans, architects, and hardens. Every role
# uses an isolated worktree. Passing QA is terminal for implementation.
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window specifier codex mcg-specifier task --model gpt-5.6-sol -c model_reasoning_effort=max -c web_search=disabled --disable multi_agent --disable multi_agent_v2 --dangerously-bypass-approvals-and-sandbox
window coder codex mcg-coder task --model gpt-5.6-sol -c model_reasoning_effort=high -c web_search=disabled --disable multi_agent --disable multi_agent_v2 --dangerously-bypass-approvals-and-sandbox
window cleaner grok mcg-cleaner batch --model grok-4.6 --reasoning-effort high --permission-mode bypassPermissions --no-subagents --disable-web-search
window architect grok mcg-architect batch --model grok-4.6 --reasoning-effort xhigh --permission-mode bypassPermissions --no-subagents --disable-web-search
window hardener grok mcg-hardener batch --model grok-4.6 --reasoning-effort high --permission-mode bypassPermissions --no-subagents --disable-web-search
window qa codex mcg-qa batch --model gpt-5.6-sol -c model_reasoning_effort=xhigh -c web_search=disabled --disable multi_agent --disable multi_agent_v2 --dangerously-bypass-approvals-and-sandbox
