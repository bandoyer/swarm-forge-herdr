# six-grok: the six-pack on grok agents, for sessions where the operator
# is Grok (model-follows-operator; budgets stay separate).
# Chain: specifier -> coder -> cleaner -> architect -> hardener -> qa.
# qa findings route back to specifier; a passing qa broadcasts the
# completion handoff (merge-only for every recipient).
# Workers run unattended like the claude packs' auto mode: approval
# prompts stall the chain (same lesson as Codex, 2026-08-17), so
# bypassPermissions is required on a trusted dev machine. grok-4.6 at
# high reasoning is pinned; subagents and web search stay off because
# the swarm is the multi-agent system and the work is repository-local.
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window specifier grok master task --model grok-4.6 --reasoning-effort high --permission-mode bypassPermissions --no-subagents --disable-web-search
window coder grok coder task --model grok-4.6 --reasoning-effort high --permission-mode bypassPermissions --no-subagents --disable-web-search
window cleaner grok cleaner batch --model grok-4.6 --reasoning-effort high --permission-mode bypassPermissions --no-subagents --disable-web-search
window architect grok architect batch --model grok-4.6 --reasoning-effort high --permission-mode bypassPermissions --no-subagents --disable-web-search
window hardener grok hardener batch --model grok-4.6 --reasoning-effort high --permission-mode bypassPermissions --no-subagents --disable-web-search
window qa grok qa batch --model grok-4.6 --reasoning-effort high --permission-mode bypassPermissions --no-subagents --disable-web-search
