# adversaries-opus5: both seats on Claude Opus 5, at effort max.
# The model is pinned by its FULL ID rather than the `opus` alias, which
# drifts to whatever is newest and would silently re-point this preset.
# Effort is pinned for the same reason: Claude Code's default has moved
# before and a preset that does not state its depth cannot be reproduced
# later. Both seats spend the all-models weekly bucket.
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window coder claude master task --model claude-opus-5 --effort max
window reviewer claude reviewer task --model claude-opus-5 --effort max
