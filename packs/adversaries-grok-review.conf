# adversaries-grok-review: the Grok adversaries chain with a human
# integration boundary. Both agents work in linked worktrees, so the project
# root and its main branch remain untouched until the operator accepts the
# terminal candidate.
# Chain: coder -> reviewer -> coder. Task mode only.
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window coder grok candidate task --model grok-4.6 --reasoning-effort high --permission-mode bypassPermissions --no-subagents --disable-web-search
window reviewer grok reviewer task --model grok-4.6 --reasoning-effort high --permission-mode bypassPermissions --no-subagents --disable-web-search
