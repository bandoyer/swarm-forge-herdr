# adversaries-opus: both seats on Opus. The heaviest all-models rung,
# for slices where the implementation itself is the risk and a cheaper
# coder would burn the review loop re-fixing its own work: auth-touching
# changes, the deployment squad, domain engine surgery. Costs roughly
# double adversaries-sonnet-opus, so reach for this when the coder seat
# needs the judgment, not just the reviewer. Fable is untouched; use
# adversaries-opus-fable instead once the Fable bucket resets and a
# Fable reviewer is worth the swap.
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window coder claude master task --model opus
window reviewer claude reviewer task --model opus
