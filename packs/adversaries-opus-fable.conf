# adversaries-opus-fable: the premium adversaries chain. Opus writes the
# code (all-models bucket); Fable sits in the reviewer seat, where its
# judgment goes furthest per token (reviews read a diff and write
# findings, so they spend a fraction of what coding does). Reserve for
# risky or ambiguous slices: auth-touching work, the deployment squad,
# domain engine changes. Do not run before the Fable weekly reset
# (Aug 23) or when the Fable bar is near its cap; adversaries-sonnet is
# the everyday preset.
# Format: window <role> <agent-kind> <worktree> [task|batch] [extra-cli-args...]
window coder claude master task --model opus
window reviewer claude reviewer task --model fable
